 font-size="20" fill="#e5e7eb">F 缓存维护</text><rect x="330" y="650" width="440" height="100" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="342" y="706.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">IMAGE_BRIDGE → DATASRAM</text><rect x="770" y="650" width="850" height="100" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="782" y="692.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">cache_csr_addr[31:0]、cache_csr_wdata[31:0]</text><text x="782" y="720.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">cache_csr_re、cache_csr_we</text><rect x="1620" y="650" width="210" height="100" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="1632" y="706.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">66</text><rect x="1830" y="650" width="1100" height="100" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="1842" y="706.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">DATASRAM → Bridge：cache_csr_rdata[31:0]、ready / 33</text><rect x="70" y="750" width="260" height="100" fill="#181e26" stroke="#394352" stroke-width="2"/><text x="82" y="806.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">C 计算访存</text><rect x="330" y="750" width="440" height="100" fill="#181e26" stroke="#394352" stroke-width="2"/><text x="342" y="806.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">CNN → DATASRAM</text><rect x="770" y="750" width="850" height="100" fill="#181e26" stroke="#394352" stroke-width="2"/><text x="782" y="792.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">10 × {cnn_addr[31:0]、cnn_wdata[31:0]</text><text x="782" y="820.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">cnn_valid、cnn_write、cnn_byte}</text><rect x="1620" y="750" width="210" height="100" fill="#181e26" stroke="#394352" stroke-width="2"/><text x="1632" y="806.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">10 × 67</text><rect x="1830" y="750" width="1100" height="100" fill="#181e26" stroke="#394352" stroke-width="2"/><text x="1842" y="792.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">DATASRAM → CNN：10 × {rdata32、ready、response}</text><text x="1842" y="820.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">10 × 34 bit；ready 与 response 含义不同</text><rect x="70" y="850" width="260" height="100" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="82" y="906.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">取消 / 故障</text><rect x="330" y="850" width="440" height="100" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="342" y="906.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">CNN → DATASRAM / 反向</text><rect x="770" y="850" width="850" height="100" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="782" y="906.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">cnn_cancel / 1：CNN → DATASRAM</text><rect x="1620" y="850" width="210" height="100" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="1632" y="906.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">1 + 1</text><rect x="1830" y="850" width="1100" height="100" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="1842" y="906.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">cnn_mem_fault / 1：DATASRAM → CNN</text><rect x="70" y="950" width="260" height="100" fill="#181e26" stroke="#394352" stroke-width="2"/><text x="82" y="1006.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">内部 bank 计算口</text><rect x="330" y="950" width="440" height="100" fill="#181e26" stroke="#394352" stroke-width="2"/><text x="342" y="1006.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">Cache issue → 两 bank RAM</text><rect x="770" y="950" width="850" height="100" fill="#181e26" stroke="#394352" stroke-width="2"/><text x="782" y="992.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">每 bank：comp_req、comp_we、comp_addr32</text><text x="782" y="1020.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">comp_wdata32、comp_wstrb4</text><rect x="1620" y="950" width="210" height="100" fill="#181e26" stroke="#394352" stroke-width="2"/><text x="1632" y="1006.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">2 × 70</text><rect x="1830" y="950" width="1100" height="100" fill="#181e26" stroke="#394352" stroke-width="2"/><text x="1842" y="992.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">每 bank：comp_rdata32、comp_error / 33</text><text x="1842" y="1020.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">固定流水延迟，未单独提供 ready</text><rect x="70" y="1050" width="260" height="100" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="82" y="1106.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">内部 DMA 本地口</text><rect x="330" y="1050" width="440" height="100" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="342" y="1106.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">DATA MOVER → bank 选择</text><rect x="770" y="1050" width="850" height="100" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="782" y="1092.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">local_valid、local_write、local_addr32</text><text x="782" y="1120.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">local_wdata32、local_wstrb4</text><rect x="1620" y="1050" width="210" height="100" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="1632" y="1106.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">70</text><rect x="1830" y="1050" width="1100" height="100" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="1842" y="1092.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">RAM → Mover：local_ready、local_rsp_valid</text><text x="1842" y="1120.0" font-family="Microsoft YaHei" font-size="20" fill="#e5e7eb">local_rdata32、local_error / 35</text><rect x="70" y="1230" width="300" height="60" fill="#202630" stroke="#526172" stroke-width="2"/><text x="168.0" y="1266.9" font-family="Microsoft YaHei" font-size="23" fill="#e5e7eb">AXI3 接口</text><rect x="370" y="1230" width="500" height="60" fill="#202630" stroke="#526172" stroke-width="2"/><text x="532.5" y="1266.9" font-family="Microsoft YaHei" font-size="23" fill="#e5e7eb">主设备 → 从设备</text><rect x="870" y="1230" width="1120" height="60" fill="#202630" stroke="#526172" stroke-width="2"/><text x="1229.5078125" y="1266.9" font-family="Microsoft YaHei" font-size="23" fill="#e5e7eb">请求通道字段（后缀按 AW / AR / W）</text><rect x="1990" y="1230" width="940" height="60" fill="#202630" stroke="#526172" stroke-width="2"/><text x="2341.5" y="1266.9" font-family="Microsoft YaHei" font-size="23" fill="#e5e7eb">返回通道字段（B / R）</text><rect x="70" y="1290" width="300" height="170" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="82" y="1381.3" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">M_AXI_GP0</text><rect x="370" y="1290" width="500" height="170" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="382" y="1381.3" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">PS → IMAGE_BRIDGE</text><rect x="870" y="1290" width="1120" height="170" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="882" y="1351.9" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">AW / AR：ADDR32、ID12、LEN4、SIZE3、BURST2</text><text x="882" y="1381.3000000000002" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">LOCK2、CACHE4、PROT3、QOS4、VALID；READY 反向</text><text x="882" y="1410.7" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">W：DATA32、STRB4、ID12、LAST、VALID；READY 反向</text><rect x="1990" y="1290" width="940" height="170" fill="#14181e" stroke="#394352" stroke-width="2"/><text x="2002" y="1351.9" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">Bridge → PS</text><text x="2002" y="1381.3000000000002" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">B：ID12、RESP2、VALID；READY 反向</text><text x="2002" y="1410.7" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">R：DATA32、ID12、RESP2、LAST、VALID；READY 反向</text><rect x="70" y="1460" width="300" height="170" fill="#181e26" stroke="#394352" stroke-width="2"/><text x="82" y="1551.3" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">S_AXI_HP0</text><rect x="370" y="1460" width="500" height="170" fill="#181e26" stroke="#394352" stroke-width="2"/><text x="382" y="1551.3" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">DATA MOVER → PS</text><rect x="870" y="1460" width="1120" height="170" fill="#181e26" stroke="#394352" stroke-width="2"/><text x="882" y="1521.9" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">AW / AR：ADDR32、ID6、LEN4、SIZE3、BURST2</text><text x="882" y="1551.3000000000002" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">LOCK2、CACHE4、PROT3、QOS4、VALID；READY 反向</text><text x="882" y="1580.7" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">W：DATA64、STRB8、ID6、LAST、VALID；READY 反向</text><rect x="1990" y="1460" width="940" height="170" fill="#181e26" stroke="#394352" stroke-width="2"/><text x="2002" y="1521.9" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">PS → Mover</text><text x="2002" y="1551.3000000000002" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">B：ID6、RESP2、VALID；READY 反向</text><text x="2002" y="1580.7" font-family="Microsoft YaHei" font-size="21" fill="#e5e7eb">R：DATA64、ID6、RESP2、LAST、VALID；READY 反向</text><rect x="80" y="1660" width="2800" height="300" fill="#101216"/><text x="80" y="1693.4" font-family="Microsoft YaHei" font-size="22" fill="#aab4c0">G 时钟与复位</text><text x="80" y="1724.2" font-family="Microsoft YaHei" font-size="22" fill="#aab4c0">PS FCLK_CLK0 → clock_unit.sys_clk；PS FCLK_RESET0_N → clock_unit.rst_n_in。</text><text x="80" y="1755.0" font-family="Microsoft YaHei" font-size="22" fill="#aab4c0">clock_unit.clk / rst_n → cpu_core、imem_rom、cnn_ees331、datasram_mover_subsystem、image_control_bridge。</text><text x="80" y="1785.8000000000002" font-family="Microsoft YaHei" font-size="22" fill="#aab4c0">clk 同时回接 M_AXI_GP0_ACLK / S_AXI_HP0_ACLK；本图不新增独立 CPU 时钟或 PLL。</text><text x="80" y="1816.6000000000001" font-family="Microsoft YaHei" font-size="22" fill="#aab4c0"></text><text x="80" y="1847.4" font-family="Microsoft YaHei" font-size="22" fill="#aab4c0">地址与外设</text><text x="80" y="1878.2" font-family="Microsoft YaHei" font-size="22" fill="#aab4c0">ARM 经 GP0 访问邮箱窗口 0x40000000；RISC-V 通过索引窗口访问 CNN（index 0x1000…0x1FFF）和 Cache CSR（index 0x2000…0x20FF）。</text><text x="80" y="1909.0" font-family="Microsoft YaHei" font-size="22" fill="#aab4c0">硬件 CNN 逻辑窗口为 64 MiB，DDR_BASE=0x10000000；当前 ARM 计划只使用其中前 16 MiB。</text><text x="80" y="1939.8000000000002" font-family="Microsoft YaHei" font-size="22" fill="#aab4c0">IMEM：8 KiB；CPU Data SRAM：16 KiB；共享两 bank：392 KiB。J3 和 SD 走 PS MIO；板级顶层还导出 DDR_* 与 FIXED_IO_*。</text><rect x="80" y="2040" width="2800" height="160" fill="#101216"/><text x="80" y="2096.9" font-family="Microsoft YaHei" font-size="21" fill="#aab4c0">软件读计划仅对 K3 重新解释命令字 4、5、12、15 及字 11 的指定标志；字 13/14 保留给帧重定位，模板宽度不变。</text><text x="80" y="2126.3" font-family="Microsoft YaHei" font-size="21" fill="#aab4c0">本图依据 source/rtl/soc/ees331/face_soc_ees331_mover_top.sv 及实际实例连接生成，未照搬旧图中当前不存在的状态灯、PL UART 或 IMEM 下载口。</text><text x="80" y="2155.7000000000003" font-family="Microsoft YaHei" font-size="21" fill="#aab4c0">全部图形、标签与连线均可在 draw.io 中逐项编辑；页面 1 / 2 为分组接口图，页面 3 是精确信号索引。</text></svg>