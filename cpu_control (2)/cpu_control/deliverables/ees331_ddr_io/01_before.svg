<text x="1900.0" y="2916.4" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#536479">
<tspan x="1900.0" dy="0">全局同名网：clk /1、rst_n /1 → 各PL模块（各模块底部已标注）</tspan>
<tspan x="1900.0" dy="33.599999999999994">交叉无圆点 = 不连接；双向箭头表示两组相反方向的独立线，并非总线三态共驱。</tspan>
<tspan x="1900.0" dy="33.599999999999994">改后容量/新模块为设计方案，尚未实施；详图逐根列出接口，不省略控制位宽。</tspan>
