<rect x="2780" y="760" width="1100" height="1360" fill="#ffffff" stroke="#adbdca" stroke-width="2"/>
<text x="3330.0" y="1098.7" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#536479">
<tspan x="3330.0" dy="0">当前板级IO（说明框，不是新增模块）</tspan>
<tspan x="3330.0" dy="37.8"></tspan>
<tspan x="3330.0" dy="37.8">输入：sys_clk /1 → clock_unit</tspan>
<tspan x="3330.0" dy="37.8">输入：rst_n_in /1 → clock_unit</tspan>
<tspan x="3330.0" dy="37.8">输入：uart_rx /1 → image_bridge</tspan>
<tspan x="3330.0" dy="37.8">输出：uart_tx /1 ← image_bridge</tspan>
<tspan x="3330.0" dy="37.8"></tspan>
<tspan x="3330.0" dy="37.8">输出：led_ready /1</tspan>
<tspan x="3330.0" dy="37.8">= bridge_ready &amp; !cnn_mem_fault</tspan>
<tspan x="3330.0" dy="37.8">输出：led_busy /1 = bridge_busy</tspan>
<tspan x="3330.0" dy="37.8">输出：led_error /1</tspan>
<tspan x="3330.0" dy="37.8">= bridge_error | cnn_mem_fault</tspan>
<tspan x="3330.0" dy="37.8"></tspan>
<tspan x="3330.0" dy="37.8">cnn_mem_fault /1：DATASRAM → 顶层LED逻辑</tspan>
<tspan x="3330.0" dy="37.8">旧CNN没有这个fault输入端口。</tspan>
<tspan x="3330.0" dy="37.8"></tspan>
<tspan x="3330.0" dy="37.8">clk /1、rst_n /1为六模块同名公共网。</tspan>
<tspan x="3330.0" dy="37.8">新版DDR/J3的引脚分组见第07页。</tspan>
</text>
