<svg xmlns="http://www.w3.org/2000/svg" width="3500" height="2600" viewBox="0 0 3500 2600">
<rect width="3500" height="2600" fill="#f8fafc"/>
<text x="1750.0" y="58.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="42" fill="#182a40">
<tspan x="1750.0" dy="0">07 板级DDR / J3 / 时钟复位 / 新旧接口变化</tspan>
</text>
<text x="1750.0" y="126.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#536479">
<tspan x="1750.0" dy="0">DDR接PS专用引脚；既有板上布线保持。图中名称来自Vivado PS7 IP；方向按电路功能，HDL部分DDR端口为inout。</tspan>
</text>
