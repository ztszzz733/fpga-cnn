<tspan x="310.0" dy="32.64">本次：ReLU + MaxPool</tspan>
<tspan x="310.0" dy="32.64">使用原有 CHW 排布</tspan>
</text>
<rect x="110" y="950" width="1940" height="130" fill="#14181e" stroke="#efdf69" stroke-width="2"/>
