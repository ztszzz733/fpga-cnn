<tspan x="1770.0" dy="0">HCI → SRAM 桥接器</tspan>
<tspan x="1770.0" dy="32.64">288 bit 拆为 9×32 bit 请求</tspan>
<tspan x="1770.0" dy="32.64">收齐后 grant，下一拍返回</tspan>
</text>
<rect x="710" y="570" width="550" height="200" fill="#14181e" stroke="#58a6ff" stroke-width="2"/>
<text x="985.0" y="637.36" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#e5e7eb">
<tspan x="985.0" dy="0">tensor_layout_dma · op12</tspan>
<tspan x="985.0" dy="32.64">CHW ↔ HWC</tspan>
<tspan x="985.0" dy="32.64">真实 SRAM 读写，计入耗时</tspan>
</text>
<rect x="110" y="570" width="400" height="200" fill="#14181e" stroke="#ef72b3" stroke-width="2"/>
<text x="310.0" y="637.36" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#e5e7eb">
