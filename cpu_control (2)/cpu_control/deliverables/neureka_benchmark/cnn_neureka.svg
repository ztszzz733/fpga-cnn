<tspan x="985.0" dy="31.28">SOFT_CLEAR → acquire</tspan>
<tspan x="985.0" dy="31.28">读取 24 字配置 → trigger</tspan>
</text>
<rect x="1490" y="175" width="560" height="250" fill="#14181e" stroke="#ff666c" stroke-width="2"/>
<text x="1770.0" y="246.95999999999998" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#e5e7eb">
<tspan x="1770.0" dy="0">官方 NEureka 计算核心</tspan>
<tspan x="1770.0" dy="35.36">4×4 PE · 通道分块</tspan>
<tspan x="1770.0" dy="35.36">权重位平面 / 输入预取</tspan>
<tspan x="1770.0" dy="35.36">卷积 + 量化</tspan>
</text>
