</text>
<text x="1100.0" y="1130.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#9ca3af">
<tspan x="1100.0" dy="0">队列逐项执行；NEureka 内部预取不等于 UART 逐像素卷积，也不等于各后处理同时运行。</tspan>
</text>
<text x="1105.0" y="1227.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#e5e7eb">
<tspan x="1105.0" dy="0">输入 CHW → 转 HWC → 卷积 / 量化 → 转 CHW → ReLU → 2×2 最大池化 → DATASRAM</tspan>
