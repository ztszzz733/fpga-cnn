function draw(){W=Math.max(360,svg.clientWidth);svg.setAttribute('viewBox',`0 0 ${W} 828`);svg.replaceChildren();
for(let i=0;i<=5;i++){const v=a+(b-a)*i/5;node('line',{x1:x(v),x2:x(v),y1:40,y2:778,stroke:'#364954'});node('text',{x:x(v),y:25,fill:'#c5d2dc','font-size':13,'text-anchor':i===0?'start':i===5?'end':'middle'},v.toFixed(b-a<100?1:0)+' ms')}
for(let f=100;f<110;f++){const y=55+(f-100)*72;node('text',{x:5,y:y+29,fill:'white','font-size':17},'图片 '+(f-99));node('line',{x1:100,x2:W-25,y1:y+24,y2:y+24,stroke:'#61717c'});
for(const j of tasks.filter(j=>j.frame===f&&j.end/1e5>a&&j.start/1e5<b)){const l=x(Math.max(a,j.start/1e5)),r=x(Math.min(b,j.end/1e5));const box=node('rect',{x:l,y,width:Math.max(.5,r-l),height:49,fill:colors[j.kind]});const title=document.createElementNS(ns,'title');title.textContent=j.label+' '+(j.start/1e5).toFixed(5)+'–'+(j.end/1e5).toFixed(5)+'ms';box.append(title);if(r-l>105){node('text',{x:l+5,y:y+20,fill:'#101820','font-size':14},(j.layer?'L'+j.layer+' ':'')+j.kind);node('text',{x:l+5,y:y+40,fill:'#101820','font-size':13},j.unit)}}}
node('line',{id:'cursor',x1:x(t),x2:x(t),y1:38,y2:778,stroke:'white','stroke-width':2});update()}
function update(){t=Number(slider.value);document.getElementById('time').textContent=t.toFixed(3)+' ms';const line=document.getElementById('cursor');if(line){line.setAttribute('x1',x(t));line.setAttribute('x2',x(t))}const body=document.getElementById('detail');body.replaceChildren();for(let f=100;f<110;f++){const j=tasks.find(j=>j.frame===f&&j.start<=t*1e5&&j.end>t*1e5);const tr=document.createElement('tr');for(const s of ['图片 '+(f-99),j?j.label:'无任务执行 / 等待',j?j.unit:'—',j?(j.start/1e5).toFixed(5)+' – '+(j.end/1e5).toFixed(5):'—']){const td=document.createElement('td');td.textContent=s;tr.append(td)}if(j)tr.style.color=colors[j.kind];body.append(tr)}}
function apply(){const l=Number(lo.value),h=Number(hi.value);if(!Number.isFinite(l)||!Number.isFinite(h)||l<0||h<=l||h>endMs){alert('请输入有效范围：0至'+endMs.toFixed(5)+'ms');return}a=l;b=h;slider.min=a;slider.max=b;slider.value=Math.min(b,Math.max(a,t));draw()}
for(const[k,c]of Object.entries(colors)){const item=document.createElement('span'),sw=document.createElement('i');sw.className='swatch';sw.style.background=c;item.append(sw,document.createTextNode(k));document.getElementById('legend').append(item)}
range.onchange=()=>{if(range.value==='custom')return;const bounds=range.value==='full'?[0,endMs]:range.value==='handoff'?[817.33663,824.42743]:[0,1225.971362];[lo.value,hi.value]=bounds;t=range.value==='handoff'?820.88203:875.69383;apply()};
document.getElementById('apply').onclick=()=>{range.value='custom';apply()};slider.oninput=update;
svg.onpointerdown=e=>{const bounds=svg.getBoundingClientRect();slider.value=Math.min(b,Math.max(a,a+(e.clientX-bounds.left-100)/(W-125)*(b-a)));update()};new ResizeObserver(draw).observe(svg);draw();
</script></html>
