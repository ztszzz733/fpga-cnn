<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1830" viewBox="0 0 2600 1830">
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="67" font-family="Microsoft YaHei, sans-serif" font-size="42" fill="#202b36">SoC 新版接线：独立程序下载口，工作与下载互斥</text>
<text x="60" y="115" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#617080">设计稿 · 未实现 RTL  |  旧版六模块与原图保留  |  新版七模块，共用一个 clk，外部 IO 由 7 根变为 9 根</text>
<rect x="40" y="155" width="2170" height="1330" fill="#fbfcfe"/>
<polyline points="40,155 2210,155 2210,1485 40,1485 40,155" fill="none" stroke="#95a6b5" stroke-width="3"/>
<text x="65" y="192" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#617080">SoC / FPGA 内部（橙色表示新增或改造；图中接口位数不含时钟、复位、状态控制）</text>
<polyline points="2260,155 2260,1485" fill="none" stroke="#c64646" stroke-width="4" stroke-dasharray="10 8"/>
<text x="2290" y="197" font-family="Microsoft YaHei, sans-serif" font-size="29" fill="#c64646">芯片外部</text>
<rect x="100" y="225" width="470" height="115" fill="#fff3e4"/>
<polyline points="100,225 570,225 570,340 100,340 100,225" fill="none" stroke="#af6517" stroke-width="3"/>
<text x="162.0" y="264" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#202b36">clock_unit（复位控制扩展）</text>
<text x="174.0" y="308" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#af6517">同一 clk；系统 / CPU 复位分开</text>
<polyline points="2390,265 570,265" fill="none" stroke="#617080" stroke-width="3"/>
<polygon points="570,265 584.0,272.0 584.0,258.0" fill="#617080"/>
<text x="999.5" y="250" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#617080">sys_clk / rst_n_in，各 1 位</text>
<text x="2290" y="320" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#202b36">晶振 / 复位</text>
<text x="670" y="332" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#617080">clk → 全部模块；rst_n → 其余模块；cpu_rst_n → 仅 CPU</text>
<rect x="100" y="425" width="470" height="180" fill="#fcebed"/>
<polyline points="100,425 570,425 570,605 100,605 100,425" fill="none" stroke="#c64646" stroke-width="3"/>
