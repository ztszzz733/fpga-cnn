<text x="380" y="726" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#2169ab">33 / 32 位</text>
<rect x="1050" y="790" width="480" height="195" fill="#e8f1fa"/>
<polyline points="1050,790 1530,790 1530,985 1050,985 1050,790" fill="none" stroke="#2169ab" stroke-width="3"/>
<text x="1217.0" y="838" font-family="Microsoft YaHei, sans-serif" font-size="33" fill="#202b36">datasram</text>
<text x="1137.5" y="879" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#202b36">A：CPU；B：CNN / 图像桥</text>
<text x="1132.0" y="924" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#af6517">原内部仲裁保留；新增 idle 导出</text>
<polyline points="570,565 735,565 735,835 1050,835" fill="none" stroke="#2169ab" stroke-width="3"/>
<polygon points="570,565 584.0,572.0 584.0,558.0" fill="#2169ab"/>
<polygon points="1050,835 1036.0,828.0 1036.0,842.0" fill="#2169ab"/>
<text x="765" y="682" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#2169ab">② CPU A口</text>
<text x="765" y="725" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#2169ab">70 / 32 位</text>
<polyline points="1290,605 1290,790" fill="none" stroke="#21805a" stroke-width="4"/>
<polygon points="1290,605 1283.0,619.0 1297.0,619.0" fill="#21805a"/>
<polygon points="1290,790 1297.0,776.0 1283.0,776.0" fill="#21805a"/>
<text x="1330" y="683" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#21805a">④ CNN B口</text>
<text x="1330" y="725" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#21805a">66 / 33 位</text>
<rect x="1670" y="790" width="480" height="195" fill="#e9f6ef"/>
<polyline points="1670,790 2150,790 2150,985 1670,985 1670,790" fill="none" stroke="#21805a" stroke-width="3"/>
<text x="1806.0" y="837" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#202b36">image_bridge</text>
<text x="1771.5" y="879" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#202b36">原图像串口 + SRAM 传输</text>
<text x="1766.0" y="926" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#af6517">新增业务锁定 / 已锁定确认</text>
<polyline points="1530,865 1670,865" fill="none" stroke="#21805a" stroke-width="4"/>
<polygon points="1530,865 1544.0,872.0 1544.0,858.0" fill="#21805a"/>
<polygon points="1670,865 1656.0,858.0 1656.0,872.0" fill="#21805a"/>
<text x="1410.0" y="1043" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#21805a">⑤ 图像 B口：70 / 35 位（含 error）</text>
<polyline points="2390,855 2150,855" fill="none" stroke="#21805a" stroke-width="4"/>
<polygon points="2390,855 2376.0,848.0 2376.0,862.0" fill="#21805a"/>
<polygon points="2150,855 2164.0,862.0 2164.0,848.0" fill="#21805a"/>
<text x="2290" y="751" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#21805a">图像 USB-UART</text>
<text x="2290" y="791" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#21805a">原 uart_rx / uart_tx</text>
<rect x="1670" y="1220" width="480" height="215" fill="#fff3e4"/>
<polyline points="1670,1220 2150,1220 2150,1435 1670,1435 1670,1220" fill="none" stroke="#af6517" stroke-width="3"/>
<text x="1745.0" y="1261" font-family="Microsoft YaHei, sans-serif" font-size="28" fill="#202b36">program_bridge（新增）</text>
<text x="1762.0078125" y="1304" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#202b36">独立 UART + 程序包 / 校验</text>
<text x="1786.0" y="1348" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#202b36">忙状态检查 + 下载互锁</text>
<text x="1798.0" y="1392" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#af6517">CPU 停止 / 启动控制</text>
<polyline points="2390,1320 2150,1320" fill="none" stroke="#af6517" stroke-width="4"/>
<polygon points="2390,1320 2376.0,1313.0 2376.0,1327.0" fill="#af6517"/>
<polygon points="2150,1320 2164.0,1327.0 2164.0,1313.0" fill="#af6517"/>
<text x="2290" y="1214" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#af6517">程序 USB-UART</text>
<text x="2290" y="1254" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#af6517">新 prog_rx / prog_tx</text>
<polyline points="1670,1330 1480,1330 1480,1115 335,1115 335,985" fill="none" stroke="#af6517" stroke-width="4"/>
<polygon points="1670,1330 1656.0,1323.0 1656.0,1337.0" fill="#af6517"/>
<polygon points="335,985 328.0,999.0 342.0,999.0" fill="#af6517"/>
<text x="580.5" y="1097" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#af6517">⑥ 新 IMEM 下载口：66 / 34 位（含 error）</text>
<text x="100" y="1236" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#af6517">新增控制线（详细方向和条件见正文第 9、10 节）</text>
<text x="100" y="1285" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#202b36">CPU可停机 / CNN空闲 / SRAM空闲 → 程序桥</text>
<text x="100" y="1330" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#202b36">程序桥 &lt;-&gt; 图像桥：锁定请求 / 已锁定</text>
<text x="100" y="1375" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#202b36">程序桥 &lt;-&gt; 复位控制：CPU保持 / 停止确认</text>
<text x="100" y="1420" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#202b36">程序桥 → IMEM：download_enable</text>
<text x="2290" y="1423" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#c64646">两组引脚独立</text>
<rect x="40" y="1520" width="2520" height="245" fill="#fff8ed"/>
<polyline points="40,1520 2560,1520 2560,1765 40,1765 40,1520" fill="none" stroke="#af6517" stroke-width="3"/>
<text x="70" y="1570" font-family="Microsoft YaHei, sans-serif" font-size="30" fill="#af6517">下载准入：忙则拒绝，不改 IMEM；空闲确认后锁新业务、停 CPU，再开放下载</text>
<text x="70" y="1627" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#202b36">运行 → 检查 / 锁定 → CPU 已停止 → 下载与读回校验 → 关闭写口 → CPU 从入口重新运行</text>
<text x="70" y="1675" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#202b36">原图像 UART 不承载程序；下载期间拒绝新图像 SRAM 业务。不能用 led_busy 代替全系统状态。</text>
<text x="70" y="1721" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#202b36">外部 IO：sys_clk、rst_n_in、uart_rx/tx、prog_rx/tx、原 3 个 LED；5 输入 + 4 输出 = 9 位。</text>
<text x="60" y="1804" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#617080">仅为接线设计稿；新增状态出口、维护握手、串口协议和引脚约束仍需实现与验证。</text>
</svg>