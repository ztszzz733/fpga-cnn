<text x="178.0" y="513" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#202b36">Control C1 + Datapath 保留</text>
<text x="227.0" y="560" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#af6517">封装补充可停机确认</text>
<rect x="1050" y="425" width="480" height="180" fill="#e9f6ef"/>
<polyline points="1050,425 1530,425 1530,605 1050,605 1050,425" fill="none" stroke="#21805a" stroke-width="3"/>
<text x="1261.5" y="471" font-family="Microsoft YaHei, sans-serif" font-size="33" fill="#202b36">cnn</text>
<text x="1145.5" y="513" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#202b36">原计算 / MMIO / 访存逻辑</text>
<text x="1134.5" y="559" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#af6517">需新增正式 cnn_idle 状态出口</text>
<polyline points="570,465 1050,465" fill="none" stroke="#21805a" stroke-width="4"/>
<polygon points="570,465 584.0,472.0 584.0,458.0" fill="#21805a"/>
<polygon points="1050,465 1036.0,458.0 1036.0,472.0" fill="#21805a"/>
<text x="690.5" y="434" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#21805a">③ MMIO：66 / 33 位</text>
<rect x="100" y="790" width="470" height="195" fill="#fff3e4"/>
<polyline points="100,790 570,790 570,985 100,985 100,790" fill="none" stroke="#af6517" stroke-width="3"/>
<text x="178.5" y="834" font-family="Microsoft YaHei, sans-serif" font-size="29" fill="#202b36">IMEM（新增可写版本）</text>
<text x="183.0" y="879" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#202b36">CPU 读口 + 程序下载读写口</text>
<text x="203.0" y="926" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#af6517">模式互斥；仍是一拍取指</text>
<polyline points="335,605 335,790" fill="none" stroke="#2169ab" stroke-width="4"/>
<polygon points="335,605 328.0,619.0 342.0,619.0" fill="#2169ab"/>
<polygon points="335,790 342.0,776.0 328.0,776.0" fill="#2169ab"/>
